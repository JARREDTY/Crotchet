<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Crotchet</title>
    <style>


</style>
</head>
<body>
    <header>
        <div class="headerin">
            <img width="50px" src="logo.jpg" alt="logo">
            <h2>Cozy Up With Crotchet</h2>
            <img width="50px" src="logo.jpg" alt="logo">
        </div>
    </header>
    <main>
        <section style="display: flex; justify-content: center;">
            <img src="logo.jpg" alt="logo">
        </section>
        <section class="sponsors">
            <h2>Our Creators</h2>
            <div class="sponsor-container">
                <div class="sponsor">
                    <img src="Mila.jpg" alt="Creator 1">
                    <p>Mila</p>
                </div>
                <div class="sponsor">
                    <img src="Shyla.jpg" alt="Creator 2">
                    <p>Shyla</p>
                </div>
                <div class="sponsor">
                    <img src="Meishka.jpg" alt="Creator 3">
                    <p>Meishka</p>
                </div>
                <div class="sponsor">
                    <img src="Ritung.jpg" alt="Creator 4">
                    <p>Ritung</p>
                </div>
            </div>
        </section>
        <section>
            <h2>Our Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://www.kyefashion.com/wp-content/uploads/2021/05/knitting-gloves-gifts.jpg" alt="Product 1">
                    <h2>Gloves</h2>
                    <p class="price">R44.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://cdna.lystit.com/400/500/tr/photos/ruelala/1596b917/trina-turk-Orange-Terrace-Linen-Top.jpeg" alt="Product 2">
                    <h2>Tops</h2>
                    <p class="price">R104.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://i5.walmartimages.com/asr/ca0ba6b5-ce7d-4b38-88f2-b4969c0799ac.91f86ee85d6f633f2ef60305cc1ef52e.jpeg" alt="Product 3">
                    <h2>Skirt</h2>
                    <p class="price">R109.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://i5.walmartimages.com/seo/Scunci-The-Original-Scrunchie-Extra-Large-Hair-Ties-in-Knit-Fabric-Assorted-Colors-12ct_8ae0847f-3cf0-46f7-93b0-ce166dfcb7d2.5288c66fd32d88f3cd15d1a6f8ec9587.jpeg" alt="Product 1">
                    <h2>Scrunchie</h2>
                    <p class="price">R34.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://th.bing.com/th/id/OIP.0Cd-5ujplZATxx28-LL57QHaEK?rs=1&pid=ImgDetMain" alt="Product 2">
                    <h2>Belly Chain</h2>
                    <p class="price">R9.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://th.bing.com/th/id/OIP.JSQzVb9GZThEmwiLkwaX4AHaHt?w=860&h=896&rs=1&pid=ImgDetMain" alt="Product 3">
                    <h2>Necklaces</h2>
                    <p class="price">R9.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://m.media-amazon.com/images/I/81Rzfn-hRiL._AC_SL1500_.jpg" alt="Product 2">
                    <h2>Headbands</h2>
                    <p class="price">R24.99</p>
                    <button>Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="https://i.pinimg.com/originals/dc/96/cc/dc96cc772e0b966926bff9f5f2aeed1d.jpg" alt="Product 3">
                    <h2>Top & Skirt</h2>
                    <p class="price">R249.99</p>
                    <button>Add to Cart</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p>&copy; Copyright 2025 JarredIndustries. All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
